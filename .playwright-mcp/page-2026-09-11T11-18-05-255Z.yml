    - article [ref=f10e80]:
      - generic [ref=f10e81]:
        - heading "01 General Refund Policy Baseline" [level=2] [ref=f10e82]:
          - generic [ref=f10e83]: "01"
          - text: General Refund Policy Baseline
        - paragraph [ref=f10e84]:
          - text: At
          - strong [ref=f10e85]: YANC ENTERPRISES
          - text: (“YANC”, “we”, “our”), we operate on cohort-based admissions with strictly limited physical and virtual seats. Due to the resource-intensive onboarding, exclusive mentor allocation, curriculum scheduling, and logistics commitment for each admitted cohort member, YANC enforces a
          - strong [ref=f10e86]: strict no-refund baseline policy
          - text: once services or cohort cycles have commenced.
      - generic [ref=f10e87]:
        - heading "02 Membership Fee Refunds" [level=2] [ref=f10e88]:
          - generic [ref=f10e89]: "02"
          - text: Membership Fee Refunds
        - paragraph [ref=f10e90]:
          - text: Cohort membership fees (₹4,500/month, billed annually) are
          - strong [ref=f10e91]: strictly non-refundable
          - text: once a membership seat is confirmed and onboarding credentials are provided.
        - paragraph [ref=f10e92]:
          - strong [ref=f10e93]: "Rare Permissible Exceptions:"
        - list [ref=f10e94]:
          - listitem [ref=f10e95]:
            - strong [ref=f10e96]: "Technical Duplicate Billing:"
            - text: Where a payment gateway error results in multiple charges for the same transaction.
          - listitem [ref=f10e97]:
            - strong [ref=f10e98]: "Pre-Onboarding Application Rejection:"
            - text: If a candidate successfully makes a payment but fails final background verification before the cohort commencement date, a full refund will be initiated minus minor gateway processing fees.
        - paragraph [ref=f10e99]:
          - text: Claims for exception reviews must be formally lodged in writing to
          - link "accounts@yanc.in" [ref=f10e100] [cursor=pointer]:
            - /url: mailto:accounts@yanc.in
          - text: within 7 calendar days of the charge date.
      - generic [ref=f10e101]:
        - heading "03 Event & Workshop Fee Refunds" [level=2] [ref=f10e102]:
          - generic [ref=f10e103]: "03"
          - text: Event & Workshop Fee Refunds
        - paragraph [ref=f10e104]: "For standalone public masterclasses, external retreats, or special workshop tickets:"
        - list [ref=f10e105]:
          - listitem [ref=f10e106]:
            - strong [ref=f10e107]: "Events Cancelled by YANC:"
            - strong [ref=f10e108]: 100% full refund
            - text: automatically credited to the original payment source within 10–15 business days.
          - listitem [ref=f10e109]:
            - strong [ref=f10e110]: "Member Cancellation > 7 Days Prior to Event:"
            - text: Eligible for a
            - strong [ref=f10e111]: 100% refund
            - text: (subject to a ₹150 administrative gateway deduction).
          - listitem [ref=f10e112]:
            - strong [ref=f10e113]: "Member Cancellation 3 to 7 Days Prior:"
            - text: Eligible for a
            - strong [ref=f10e114]: 50% partial refund
            - text: .
          - listitem [ref=f10e115]:
            - strong [ref=f10e116]: "Member Cancellation < 3 Days Prior / No-Show:"
            - strong [ref=f10e117]: No refund
            - text: permitted under any circumstances due to reserved venue seats and catering commitments.
      - generic [ref=f10e118]:
        - heading "04 Payment Errors & Duplicate Transactions" [level=2] [ref=f10e119]:
          - generic [ref=f10e120]: "04"
          - text: Payment Errors & Duplicate Transactions
        - generic [ref=f10e126]:
          - strong [ref=f10e127]: "15-Day Logging Window:"
          - text: If you believe you were charged erroneously or noticed a duplicate debited amount, you must report the issue within
          - strong [ref=f10e128]: 15 calendar days
          - text: with your transaction reference ID and bank statement copy.
        - paragraph [ref=f10e129]:
          - text: Send full payment reconciliation requests to
          - link "accounts@yanc.in" [ref=f10e130] [cursor=pointer]:
            - /url: mailto:accounts@yanc.in
          - text: . Unclaimed duplicate charges after 15 days will be adjusted as future event credits.
      - generic [ref=f10e131]:
        - heading "05 Refund Processing Timeframes" [level=2] [ref=f10e132]:
          - generic [ref=f10e133]: "05"
          - text: Refund Processing Timeframes
        - paragraph [ref=f10e134]:
          - text: Once an eligible refund is verified and approved by the YANC finance desk, the funds will be disbursed within
          - strong [ref=f10e135]: 10 to 15 business days
          - text: to the original payment method (Bank Account, UPI, Credit/Debit Card).
        - paragraph [ref=f10e136]: YANC is not liable for secondary delays caused by intermediary banks, payment aggregators, or public banking holidays.
      - generic [ref=f10e137]:
        - heading "06 No Refund for Misconduct or Violations" [level=2] [ref=f10e138]:
          - generic [ref=f10e139]: "06"
          - text: No Refund for Misconduct or Violations
        - generic [ref=f10e144]:
          - strong [ref=f10e145]: "Non-Transferable & Zero Refund on Expulsion:"
          - text: Memberships are strictly personal and non-transferable to other individuals. If a member is suspended or expelled due to breaches of the
          - link "Code of Conduct" [ref=f10e146] [cursor=pointer]:
            - /url: terms-and-conditions.html#sec-7
          - text: ","
          - strong [ref=f10e147]: no refunds or partial fee pro-rations will be granted
          - text: .
      - generic [ref=f10e148]:
        - heading "07 Changes to This Policy" [level=2] [ref=f10e149]:
          - generic [ref=f10e150]: "07"
          - text: Changes to This Policy
        - paragraph [ref=f10e151]: YANC ENTERPRISES reserves the right to revise or update this Refund & Cancellation Policy at its discretion. Any updates will become binding immediately upon being posted on our official portal.
      - generic [ref=f10e152]:
        - heading "08 Accounts & Billing Inquiries" [level=2] [ref=f10e153]:
          - generic [ref=f10e154]: "08"
          - text: Accounts & Billing Inquiries
        - paragraph [ref=f10e155]: "For all billing queries, invoice requests, or refund claim submissions, please contact our accounts team:"
        - paragraph [ref=f10e156]:
          - link "accounts@yanc.in" [ref=f10e157] [cursor=pointer]:
            - /url: mailto:accounts@yanc.in
        - paragraph [ref=f10e161]: YANC ENTERPRISES · Finance & Accounts Department · Hyderabad, Telangana, India
