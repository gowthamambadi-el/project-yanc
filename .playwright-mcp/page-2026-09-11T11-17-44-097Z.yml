    - article [ref=f9e82]:
      - generic [ref=f9e83]:
        - heading "01 Introduction & Scope" [level=2] [ref=f9e84]:
          - generic [ref=f9e85]: "01"
          - text: Introduction & Scope
        - paragraph [ref=f9e86]:
          - text: At
          - strong [ref=f9e87]: YANC ENTERPRISES
          - text: (“YANC”, “we”, “our”), protecting the privacy and personal data of our youth community (aged 15 to 28) is a foundational tenet of our organization. This Privacy Policy details how we collect, process, store, and safeguard your personal data across
          - link "www.yanc.in" [ref=f9e88] [cursor=pointer]:
            - /url: https://www.yanc.in
          - text: ", applicant portals, and cohort communications."
        - paragraph [ref=f9e89]:
          - text: We adhere strictly to the
          - strong [ref=f9e90]: Digital Personal Data Protection Act, 2023 (DPDP Act)
          - text: of India and global data privacy best practices.
      - generic [ref=f9e91]:
        - heading "02 Data We Collect" [level=2] [ref=f9e92]:
          - generic [ref=f9e93]: "02"
          - text: Data We Collect
        - paragraph [ref=f9e94]: "We collect information necessary to facilitate admissions, personalized mentorship matching, workshops, and safe community engagement:"
        - paragraph [ref=f9e95]:
          - strong [ref=f9e96]: "2.1 Personal Identification Information:"
        - list [ref=f9e97]:
          - listitem [ref=f9e98]:
            - strong [ref=f9e99]: "Basic Profile Details:"
            - text: Full name, date of birth / age, gender, educational background, college/school affiliation, and profile photograph.
          - listitem [ref=f9e100]:
            - strong [ref=f9e101]: "Contact Information:"
            - text: Personal email address, WhatsApp / mobile number, current city, and state of residence.
          - listitem [ref=f9e102]:
            - strong [ref=f9e103]: "Application Submissions:"
            - text: Answers to screening questionnaires, statement of purpose, portfolio links, and interest tracks.
          - listitem [ref=f9e104]:
            - strong [ref=f9e105]: "Account Credentials:"
            - text: Login identifiers, authentication session logs, and user-generated posts.
        - paragraph [ref=f9e106]:
          - strong [ref=f9e107]: "2.2 Automatically Collected Data:"
        - list [ref=f9e108]:
          - listitem [ref=f9e109]:
            - text: Technical metadata including IP addresses, browser types, operating systems, and timestamped page interaction metrics collected via cookies (see our
            - link "Cookie Policy" [ref=f9e110] [cursor=pointer]:
              - /url: cookie-policy.html
            - text: ).
        - paragraph [ref=f9e111]:
          - strong [ref=f9e112]: "2.3 Sensitive Personal Data:"
        - paragraph [ref=f9e113]: YANC does not collect sensitive financial, biometric, or religious data unless explicitly required for formal event compliance or scholarship verification with explicit parental consent.
      - generic [ref=f9e114]:
        - heading "03 How We Use Your Data" [level=2] [ref=f9e115]:
          - generic [ref=f9e116]: "03"
          - text: How We Use Your Data
        - paragraph [ref=f9e117]: "Your information is processed strictly for legitimate educational, developmental, and community purposes:"
        - list [ref=f9e118]:
          - listitem [ref=f9e119]:
            - strong [ref=f9e120]: "Cohort Onboarding & Profile Setup:"
            - text: Evaluating membership suitability and configuring member directories.
          - listitem [ref=f9e121]:
            - strong [ref=f9e122]: "Mentorship & Career Matching:"
            - text: Connecting members with relevant industry mentors, coaches, and internship tracks.
          - listitem [ref=f9e123]:
            - strong [ref=f9e124]: "Communications:"
            - text: Delivering critical schedule alerts, workshop RSVPs, newsletter insights, and payment confirmations.
          - listitem [ref=f9e125]:
            - strong [ref=f9e126]: "Platform Security & Safety:"
            - text: Authenticating member accounts, preventing spam, and ensuring compliance with our Code of Conduct.
      - generic [ref=f9e127]:
        - heading "04 Data Sharing & Non-Sale Disclosure" [level=2] [ref=f9e128]:
          - generic [ref=f9e129]: "04"
          - text: Data Sharing & Non-Sale Disclosure
        - generic [ref=f9e134]:
          - strong [ref=f9e135]: "Strict Non-Sale Policy:"
          - text: YANC will
          - strong [ref=f9e136]: never sell, rent, or trade
          - text: your personal information to third-party advertisers, data brokers, or marketing agencies under any circumstances.
        - paragraph [ref=f9e137]: "Data is shared only in the following limited scenarios:"
        - list [ref=f9e138]:
          - listitem [ref=f9e139]:
            - strong [ref=f9e140]: "Curated Mentors & Program Directors:"
            - text: Sharing necessary career profiles to facilitate 1-on-1 coaching sessions.
          - listitem [ref=f9e141]:
            - strong [ref=f9e142]: "Hiring Partners & Startups:"
            - text: Disclosing resumes only after obtaining your explicit affirmative opt-in consent.
          - listitem [ref=f9e143]:
            - strong [ref=f9e144]: "Legal & Regulatory Authorities:"
            - text: Where disclosure is legally mandated by Indian statutory bodies or law enforcement agencies.
      - generic [ref=f9e145]:
        - heading "05 Data Security & Retention" [level=2] [ref=f9e146]:
          - generic [ref=f9e147]: "05"
          - text: Data Security & Retention
        - paragraph [ref=f9e148]: We employ enterprise-grade SSL/TLS encryption in transit and AES-256 encryption at rest. Cloud infrastructure is hosted in secure, ISO-certified data centers with strict role-based access control (RBAC).
        - paragraph [ref=f9e149]:
          - text: We retain your information only for as long as your cohort membership remains active or as required by statutory accounting and legal compliance periods. You may request permanent deletion of your account and personal records at any time by emailing
          - link "legal@yanc.in" [ref=f9e150] [cursor=pointer]:
            - /url: mailto:legal@yanc.in
          - text: .
      - generic [ref=f9e151]:
        - heading "06 Your Rights under DPDP Act 2023" [level=2] [ref=f9e152]:
          - generic [ref=f9e153]: "06"
          - text: Your Rights under DPDP Act 2023
        - paragraph [ref=f9e154]: "Under the Digital Personal Data Protection Act 2023, you (and your parents/guardians if under 18) possess the following rights:"
        - list [ref=f9e155]:
          - listitem [ref=f9e156]:
            - strong [ref=f9e157]: "Right to Access:"
            - text: Request a summary of all personal data held about you and processing activities.
          - listitem [ref=f9e158]:
            - strong [ref=f9e159]: "Right to Correction & Erasure:"
            - text: Rectify inaccurate personal records or request immediate erasure.
          - listitem [ref=f9e160]:
            - strong [ref=f9e161]: "Right of Grievance Redressal:"
            - text: File a formal query with our designated Data Protection Officer.
          - listitem [ref=f9e162]:
            - strong [ref=f9e163]: "Right to Withdraw Consent:"
            - text: Revoke previously granted data processing permissions at any time.
      - generic [ref=f9e164]:
        - heading "07 Third-Party Links & Integrations" [level=2] [ref=f9e165]:
          - generic [ref=f9e166]: "07"
          - text: Third-Party Links & Integrations
        - paragraph [ref=f9e167]: Our platform may link to external tools (such as video conferencing, social platforms, or ticket gateways). YANC is not responsible for the privacy standards of external websites. We encourage you to review their independent privacy declarations.
      - generic [ref=f9e168]:
        - heading "08 Children’s Privacy (Minors Under 18)" [level=2] [ref=f9e169]:
          - generic [ref=f9e170]: "08"
          - text: Children’s Privacy (Minors Under 18)
        - generic [ref=f9e175]:
          - strong [ref=f9e176]: "Parental Oversight:"
          - text: We do not intentionally process data of minors under 18 without verifiable parental/guardian consent. Parents hold the absolute right to inspect, correct, or request deletion of their child’s records at any time.
      - generic [ref=f9e177]:
        - heading "09 Updates to This Privacy Policy" [level=2] [ref=f9e178]:
          - generic [ref=f9e179]: "09"
          - text: Updates to This Privacy Policy
        - paragraph [ref=f9e180]: YANC may update this Privacy Policy to reflect changing legal requirements or operational practices. When material revisions occur, we will notify members via prominent site banners or registered email communications.
      - generic [ref=f9e181]:
        - heading "10 Contact Us & Grievance Redressal" [level=2] [ref=f9e182]:
          - generic [ref=f9e183]: "10"
          - text: Contact Us & Grievance Redressal
        - paragraph [ref=f9e184]: "If you have any questions, rights requests, or grievances concerning your data, please contact our Legal & Data Protection Officer:"
        - paragraph [ref=f9e185]:
          - link "legal@yanc.in" [ref=f9e186] [cursor=pointer]:
            - /url: mailto:legal@yanc.in
        - paragraph [ref=f9e190]: YANC ENTERPRISES · Data Protection & Legal Compliance Desk · Hyderabad, Telangana, India
