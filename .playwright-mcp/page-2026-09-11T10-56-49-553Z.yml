    - generic [ref=f5e31]: Got Questions?
    - heading [level=1] [ref=f5e32]:
      - text: Frequently Asked
      - emphasis [ref=f5e33]: Questions
    - paragraph [ref=f5e34]: Everything you need to know about YANC, membership, and programs.
    - textbox "Search questions, keywords, or topics..." [ref=f5e37]
  - main [ref=f5e38]:
    - generic [ref=f5e39]:
      - button "Discover Meet" [ref=f5e40]
      - generic [ref=f5e46]:
        - generic [ref=f5e47]:
          - heading "What is a Discover Meet?" [level=3] [ref=f5e48]
          - paragraph [ref=f5e49]: Discover Meet is a formal meet-and-greet session where prospective members receive an overview of YANC.
        - generic [ref=f5e50]:
          - heading "What exactly is YANC, and how is it different from other networking or youth clubs?" [level=3] [ref=f5e51]
          - paragraph [ref=f5e52]: YANC is a unique networking platform designed to empower young minds by building meaningful connections and learning life skills from a young age. Unlike traditional groups, YANC focuses on experiential learning, mentorship, and personal growth.
        - generic [ref=f5e53]:
          - heading "How does YANC help young people beyond traditional education?" [level=3] [ref=f5e54]
          - paragraph [ref=f5e55]: YANC bridges the gap between traditional education systems and real-world skills by focusing on life skills, networking, and mentorship opportunities that schools and colleges typically do not offer at scale.
        - generic [ref=f5e56]:
          - heading "Is YANC only for students, or can working professionals also join?" [level=3] [ref=f5e57]
          - paragraph [ref=f5e58]: YANC is open to students, young professionals, and entrepreneurs aged 18–28 who are keen on learning, growing, and contributing to a supportive network.
        - generic [ref=f5e59]:
          - heading "How often do YANC members meet, and what happens in these meetings?" [level=3] [ref=f5e60]
          - paragraph [ref=f5e61]: YANC members typically meet bi-weekly for structured discussions, mentorship sessions, networking, and interactive learning experiences.
        - generic [ref=f5e62]:
          - heading "Is YANC open to members from all backgrounds and fields?" [level=3] [ref=f5e63]
          - paragraph [ref=f5e64]: Yes, YANC encourages a diverse community where members from various backgrounds and fields can connect and learn from one another.
    - generic [ref=f5e65]:
      - button "Membership Application" [ref=f5e66]
      - generic [ref=f5e72]:
        - generic [ref=f5e73]:
          - heading "What is the purpose of the membership application process?" [level=3] [ref=f5e74]
          - paragraph [ref=f5e75]: The process is designed to evaluate, identify, and onboard driven young individuals whose values align with YANC's mission of purposeful learning, genuine connection, and real-world impact.
        - generic [ref=f5e76]:
          - heading "How can someone apply to join YANC?" [level=3] [ref=f5e77]
          - paragraph [ref=f5e78]: Interested individuals can apply via the official website (www.yanc.in) by filling out the "Contact Us" or membership inquiry form. Our admissions team will reach out with the next steps.
        - generic [ref=f5e79]:
          - heading "Is there a selection process? If yes, what does it involve?" [level=3] [ref=f5e80]
          - paragraph [ref=f5e81]: Yes. The process involves an application review, a personal interview, and a brief presentation on a designated topic to assess alignment and commitment.
        - generic [ref=f5e82]:
          - heading "What happens after someone gets selected as a YANC member?" [level=3] [ref=f5e83]
          - paragraph [ref=f5e84]: Selected members receive an official welcome kit, complete onboarding orientation, are paired with a peer buddy, and join an active cohort for networking and development.
        - generic [ref=f5e85]:
          - heading "Is there a fee to join YANC? What does it cover?" [level=3] [ref=f5e86]
          - paragraph [ref=f5e87]: Yes, a membership fee covers bi-weekly structured meetups, food & beverages, curated learning resources, mentor access, and community initiatives. Full financial details are walk-through during the Discover Meet.
        - generic [ref=f5e88]:
          - heading "Can parents enroll their children directly?" [level=3] [ref=f5e89]
          - paragraph [ref=f5e90]: No. Youth members must apply and go through the selection process themselves to ensure personal motivation and commitment.
        - generic [ref=f5e91]:
          - heading "Can members join from any city?" [level=3] [ref=f5e92]
          - paragraph [ref=f5e93]: Currently, YANC is based and operates in Hyderabad. Expansion into other major cities is underway.
        - generic [ref=f5e94]:
          - heading "If someone is not selected, can they reapply later?" [level=3] [ref=f5e95]
          - paragraph [ref=f5e96]: Yes, candidates are encouraged to reapply in subsequent cohort cycles after a designated period.
    - generic [ref=f5e97]:
      - button "Payment Terms" [ref=f5e98]
      - generic [ref=f5e104]:
        - generic [ref=f5e105]:
          - heading "When is the payment due after selection?" [level=3] [ref=f5e106]
          - paragraph [ref=f5e107]: Once selected, you will receive an official payment link. The fee must be completed within one week to reserve and confirm your cohort seat.
        - generic [ref=f5e108]:
          - heading "What is the cost of YANC membership?" [level=3] [ref=f5e109]
          - paragraph [ref=f5e110]: The membership fee is ₹4,500 per month, billed annually.
        - generic [ref=f5e111]:
          - heading "What payment methods are accepted?" [level=3] [ref=f5e112]
          - paragraph [ref=f5e113]: We accept all major payment methods including UPI, credit/debit cards, net banking, and verified digital wallets.
        - generic [ref=f5e114]:
          - heading "Are there any refunds if someone decides to discontinue?" [level=3] [ref=f5e115]
          - paragraph [ref=f5e116]: Membership fees are non-refundable. In rare, exceptional circumstances, deferral to the subsequent cohort may be considered.
        - generic [ref=f5e117]:
          - heading "Does the membership fee cover all YANC events and programs?" [level=3] [ref=f5e118]
          - paragraph [ref=f5e119]: The core fee covers all scheduled bi-weekly meetups, mentor sessions, resources, and regular networking events. Special external socials, retreats, or optional off-sites may involve separate registration fees.
    - generic [ref=f5e120]:
      - button "Mind Mashup" [ref=f5e121]
      - generic [ref=f5e128]:
        - heading "What is the objective of the Young Minds Mashup funding process?" [level=3] [ref=f5e129]
        - paragraph [ref=f5e130]: To establish a transparent, structured pathway for evaluating, funding, and incubating early prototype projects through the YANC Prototype Fund in partnership with Sri Venture Partners (SVP). The program provides funding and hands-on guidance for innovators aged 15–28 transitioning from ideation to prototype.
  - complementary [ref=f5e131]:
