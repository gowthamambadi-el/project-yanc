    - article [ref=f8e85]:
      - generic [ref=f8e86]:
        - heading "01 Introduction & Scope" [level=2] [ref=f8e87]:
          - generic [ref=f8e88]: "01"
          - text: Introduction & Scope
        - paragraph [ref=f8e89]:
          - text: Welcome to
          - strong [ref=f8e90]: YANC ENTERPRISES
          - text: (“YANC”, “we”, “our”, or “us”). These Terms & Conditions (“Terms”) govern your access to and use of our official website (
          - link "www.yanc.in" [ref=f8e91] [cursor=pointer]:
            - /url: https://www.yanc.in
          - text: ), web applications, cohort memberships, offline meetups, and associated services.
        - paragraph [ref=f8e92]: By accessing or using our platform, submitting an application, or attending YANC events, you acknowledge that you have read, understood, and agreed to be bound by these Terms. If you do not agree, you must refrain from using the platform and its services.
      - generic [ref=f8e93]:
        - heading "02 Eligibility & Age Requirements" [level=2] [ref=f8e94]:
          - generic [ref=f8e95]: "02"
          - text: Eligibility & Age Requirements
        - paragraph [ref=f8e96]:
          - text: YANC is curated specifically for ambitious young minds. Membership and participation are strictly open to individuals aged
          - strong [ref=f8e97]: 15 to 28 years
          - text: at the time of application.
        - generic [ref=f8e102]:
          - strong [ref=f8e103]: "Parental / Guardian Consent:"
          - text: Applicants under 18 years of age are required to obtain express parental or legal guardian consent prior to final onboarding and cohort fee payment.
        - paragraph [ref=f8e104]: You represent and warrant that all information submitted during the registration, screening, and interview stages is accurate, current, and truthful. Providing false identification or inaccurate details constitutes grounds for immediate application rejection or revocation of membership.
      - generic [ref=f8e105]:
        - heading "03 User Responsibilities" [level=2] [ref=f8e106]:
          - generic [ref=f8e107]: "03"
          - text: User Responsibilities
        - paragraph [ref=f8e108]: "As a user or cohort member of YANC, you agree to maintain a high standard of professional and personal integrity. You agree that you shall NOT:"
        - list [ref=f8e109]:
          - listitem [ref=f8e110]: Post, transmit, or share any abusive, offensive, defamatory, obscene, or unlawful content across YANC digital groups, events, or workshops.
          - listitem [ref=f8e111]: Engage in spamming, unsolicited commercial marketing, scraping, or mass distribution of promotional materials to other members.
          - listitem [ref=f8e112]: Attempt to hack, breach, probe, or disrupt any digital infrastructure, servers, databases, or networks belonging to YANC.
          - listitem [ref=f8e113]: Impersonate any individual, organization, mentor, executive, or fellow club member.
          - listitem [ref=f8e114]: Engage in unauthorized photography, video recording, or distribution of internal confidential sessions without prior written authorization.
      - generic [ref=f8e115]:
        - heading "04 Membership & Account Security" [level=2] [ref=f8e116]:
          - generic [ref=f8e117]: "04"
          - text: Membership & Account Security
        - paragraph [ref=f8e118]: Application and acceptance into YANC are subject to selective screening and cohort capacity limits. YANC reserves the exclusive right to approve, waitlist, suspend, or terminate any account or membership application at its sole discretion.
        - paragraph [ref=f8e119]:
          - text: You are solely responsible for maintaining the confidentiality of your login credentials, magic links, or account access tokens. Any activity conducted under your registered account is deemed to be executed by you. You must immediately notify YANC at
          - link "connect@yanc.in" [ref=f8e120] [cursor=pointer]:
            - /url: mailto:connect@yanc.in
          - text: upon suspecting any unauthorized access.
      - generic [ref=f8e121]:
        - heading "05 Intellectual Property Rights" [level=2] [ref=f8e122]:
          - generic [ref=f8e123]: "05"
          - text: Intellectual Property Rights
        - paragraph [ref=f8e124]:
          - text: All trademarks, service marks, brand names, visual logos, interface designs, curriculum materials, proprietary masterclasses, and digital media hosted on www.yanc.in are the sole intellectual property of
          - strong [ref=f8e125]: YANC ENTERPRISES
          - text: or its licensors.
        - paragraph [ref=f8e126]: No content, workshop frameworks, or community recordings may be reproduced, modified, republished, distributed, or commercially exploited without prior written consent from YANC management.
      - generic [ref=f8e127]:
        - heading "06 Privacy & Data Protection" [level=2] [ref=f8e128]:
          - generic [ref=f8e129]: "06"
          - text: Privacy & Data Protection
        - paragraph [ref=f8e130]:
          - text: Your privacy is paramount. All personal data collected through applications, surveys, onboarding forms, and event participation is processed in strict compliance with our
          - link "Privacy Policy" [ref=f8e131] [cursor=pointer]:
            - /url: privacy-policy.html
          - text: and applicable Indian data protection legislation (including the Digital Personal Data Protection Act 2023).
      - generic [ref=f8e132]:
        - heading "07 Code of Conduct & Zero Tolerance" [level=2] [ref=f8e133]:
          - generic [ref=f8e134]: "07"
          - text: Code of Conduct & Zero Tolerance
        - generic [ref=f8e139]:
          - strong [ref=f8e140]: "Zero Tolerance Policy:"
          - text: YANC enforces an absolute zero-tolerance standard against harassment, bullying, sexual misconduct, hate speech, discrimination (on grounds of race, caste, gender, religion, or orientation), or physical/verbal intimidation.
        - paragraph [ref=f8e141]:
          - text: Any member found in breach of this Code of Conduct will face
          - strong [ref=f8e142]: immediate expulsion
          - text: ", forfeiture of cohort membership with zero refund, and potential escalation to law enforcement authorities."
      - generic [ref=f8e143]:
        - heading "08 Third-Party Links & External Services" [level=2] [ref=f8e144]:
          - generic [ref=f8e145]: "08"
          - text: Third-Party Links & External Services
        - paragraph [ref=f8e146]: Our platform may feature links to external websites, third-party mentors, event venues, ticketing tools, or job portals. These links are provided solely for your convenience. YANC does not control, endorse, or accept liability for the content, privacy practices, or accuracy of third-party platforms.
      - generic [ref=f8e147]:
        - heading "09 Limitation of Liability" [level=2] [ref=f8e148]:
          - generic [ref=f8e149]: "09"
          - text: Limitation of Liability
        - paragraph [ref=f8e150]: To the maximum extent permitted by applicable Indian law, YANC ENTERPRISES, its directors, officers, mentors, and partners shall not be held liable for any direct, indirect, incidental, punitive, or consequential damages resulting from your use of or inability to use the platform, event participation, or interpersonal interactions between members.
        - paragraph [ref=f8e151]: While we strive for high uptime and smooth operations, services are provided on an “as-is” and “as-available” basis without warranties of any kind.
      - generic [ref=f8e152]:
        - heading "10 Modifications to Terms" [level=2] [ref=f8e153]:
          - generic [ref=f8e154]: "10"
          - text: Modifications to Terms
        - paragraph [ref=f8e155]: YANC reserves the right to review, modify, or update these Terms at any time. Material revisions will be posted on this page with an updated Effective Date. Your continued use of the website or attendance at club activities after updates are published constitutes binding acceptance.
      - generic [ref=f8e156]:
        - heading "11 Termination & Account Deletion" [level=2] [ref=f8e157]:
          - generic [ref=f8e158]: "11"
          - text: Termination & Account Deletion
        - paragraph [ref=f8e159]: We may suspend or terminate your membership immediately without prior notice in the event of Terms violations, misconduct, or fraudulent activities.
        - paragraph [ref=f8e160]:
          - text: Members who wish to voluntarily terminate their membership or request record deletion may submit a written notice to
          - link "connect@yanc.in" [ref=f8e161] [cursor=pointer]:
            - /url: mailto:connect@yanc.in
          - text: . Financial provisions upon termination are governed by our
          - link "Refund Policy" [ref=f8e162] [cursor=pointer]:
            - /url: refund-policy.html
          - text: .
      - generic [ref=f8e163]:
        - heading "12 Governing Law & Dispute Resolution" [level=2] [ref=f8e164]:
          - generic [ref=f8e165]: "12"
          - text: Governing Law & Dispute Resolution
        - paragraph [ref=f8e166]:
          - text: These Terms and any disputes arising out of or related to YANC shall be governed by and construed in accordance with the
          - strong [ref=f8e167]: laws of the Republic of India
          - text: .
        - paragraph [ref=f8e168]:
          - text: Any legal proceedings, claims, or arbitration shall be subject to the exclusive jurisdiction of the competent courts situated in
          - strong [ref=f8e169]: Hyderabad, Telangana, India
          - text: .
      - generic [ref=f8e170]:
